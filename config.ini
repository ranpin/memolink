# MIRIX配置文件
# 此文件包含系统运行所需的各种配置项

# API配置部分
[api]
# 云端API密钥，用于访问阿里云DashScope等服务
#key=***REMOVED***
# 本地API URL，用于访问本地部署的OpenAI兼容服务（如本地LLM服务）
# 如果配置了此选项，系统将优先使用本地API而不是云端API
local_url=http://localhost:13984/api/llm

# 模型配置部分
[model]
# 文本生成模型名称
text_model_name=qwen2.5-omni-7b-aliyun
# 文本嵌入模型名称
embedding_model_name=text-embedding-v4
# 多模态模型名称
multimodal_model_name=qwen2.5-omni-7b-aliyun
# 向量维度大小
dimension=128

# 数据库配置部分
[database]
# 数据库文件路径
db_path=mirix.db

# 记忆生成配置部分
[memory_generation]
# 提示：可根据环境/模式选择不同配置：
#   - demo_mode（演示/开发）：message_threshold 较小（例如 3），time_interval_minutes 较短（例如 5-10）
#   - low_power_mode（省电/轻负载）：message_threshold 中等（例如 8-12），time_interval_minutes 较长（例如 30-60）
#   - debug_mode（调试/压测）：message_threshold 很小（例如 1-2），time_interval_minutes 很短（例如 1-5），便于频繁观察行为
# 预置模式推荐（仅供参考，不会自动切换）：
#   demo_mode:
#     [memory_generation] message_threshold=3, time_interval_minutes=5, max_sources_per_generation≈50
#     [memory_scheduler]  enabled=true, interval_seconds=60
#   low_power_mode:
#     [memory_generation] message_threshold=10, time_interval_minutes=60, max_sources_per_generation≈30
#     [memory_scheduler]  enabled=true, interval_seconds=600
#   debug_mode:
#     [memory_generation] message_threshold=1, time_interval_minutes=1, max_sources_per_generation≈20
#     [memory_scheduler]  enabled=true, interval_seconds=30
# 触发记忆生成的消息/原材料数量阈值（消息+多模态数据）
message_threshold=3
# 时间间隔阈值（分钟）
time_interval_minutes=30
# 置信度阈值（0-1之间的浮点数）
confidence_threshold=0.5
# 单次生成中最多使用的来源数量（消息+多模态）
max_sources_per_generation=50
# 是否写入溯源记录（true/false）
enable_provenance=true
# 是否启用情景记忆生成（true/false）
enable_episodic=true
# 是否启用语义记忆生成（true/false）
enable_semantic=true
# 是否启用核心记忆生成（true/false）
enable_core=true
# 是否启用程序记忆生成（true/false）
enable_procedural=true
# 是否启用秘密保险库生成（true/false）
enable_secret_vault=true

# 溯源范围细化配置：类型配额
# 每次生成记忆时，最多收集的消息数量
max_messages_quota=10
# 每次生成记忆时，最多收集的截图数量
max_screenshots_quota=5
# 每次生成记忆时，最多收集的音频数量
max_audios_quota=3
# 每次生成记忆时，最多收集的图像数量
max_images_quota=5
# 是否仅从当前会话收集来源（true/false）
filter_by_current_session=false

# 记忆调度配置部分
[memory_scheduler]
# 建议：
#   - 开发/演示环境（demo_mode）：enabled=true，interval_seconds 设为 60-300 之间便于观察效果
#   - 生产/省电环境（low_power_mode）：enabled=true，interval_seconds 通常不小于 600 秒
#   - 调试环境（debug_mode）：enabled=true，interval_seconds 可设为 30-60，配合较小的 message_threshold 便于快速验证
# 如需切换模式，可参考上述“预置模式推荐”手动调整 memory_generation 与 memory_scheduler 的参数组合。
# 是否启用后台记忆调度（true/false）
enabled=true
# 调度检查间隔（秒），开发环境可调小便于验证
interval_seconds=300