# memolink 配置文件
# 此文件包含系统运行所需的各种配置项

# API配置部分
[api]
# 云端API密钥，用于访问阿里云DashScope等服务
# 请填入你自己的 DashScope API Key（勿把真实 key 提交进仓库）
#key=your_dashscope_api_key_here
# 本地API URL，用于访问本地部署的OpenAI兼容服务（如本地LLM服务）
# 如果配置了此选项，系统将优先使用本地API而不是云端API
# 端侧部署（orin-edge）：填本地 llama-server 地址，如 http://127.0.0.1:8099
# （Q2 消解器的 System-2 用它调本地 4B；留空则回退云端 DashScope）
local_url=
# Q9：VLM（视觉语言模型）本地服务 URL——座舱多模态轮次（observe）用它做图像 caption。
# 刻意与 local_url 分开：caption-then-embed 下 VLM 只负责图像→文本，文本侧（提取/消解/
# 回复）仍走 local_url 的 qwen3-4b，否则 Q2/Q4 的标定全部失效（q9_multimodal_plan.md §1.2）。
# 端侧部署：填第二个 llama-server 实例地址，如 http://127.0.0.1:8098（留空则 observe 不可用）
vlm_url=

# 模型配置部分
[model]
# 文本生成模型名称
text_model_name=qwen2.5-omni-7b-aliyun
# 文本嵌入模型名称
embedding_model_name=text-embedding-v4
# 多模态模型名称
multimodal_model_name=qwen2.5-omni-7b-aliyun
# 向量维度大小
dimension=128

# 数据库配置部分
[database]
# 数据库文件路径
db_path=memolink.db

# 端侧推理配置部分（仅 MEMOLINK_ENABLE_EDGE=ON 时生效）
# 配置了 embedding_model_path + tokenizer_path 后，文本 embedding 走本地 ONNX，
# 不再依赖云端 DashScope text-embedding 接口。
[edge]
# 本地 embedding ONNX 模型路径（external data 需与 .onnx 同目录同名）
embedding_model_path=
# WordPiece tokenizer.json 路径
tokenizer_path=
# ONNX intra-op 线程数（刻意少占核，把算力留给 LLM）
embedding_threads=4